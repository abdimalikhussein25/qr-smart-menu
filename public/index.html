<!doctype html>
<html lang="so">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#14382d" />
  <title>Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero">
    <div class="hero-top">
      <span id="table-badge" class="badge" hidden></span>
      <button id="lang" class="lang" type="button" aria-label="Change language">EN</button>
    </div>
    <h1 id="name">…</h1>
    <p id="tagline"></p>
  </header>

  <nav id="tabs" class="tabs" aria-label="Categories"></nav>

  <main id="menu" class="menu" aria-live="polite"></main>

  <button id="cart-bar" class="cart-bar" type="button" hidden>
    <span class="cart-count" id="cart-count">0</span>
    <span id="cart-label">Eeg dalabka</span>
    <span id="cart-total">$0.00</span>
  </button>

  <dialog id="sheet" class="sheet">
    <form method="dialog" class="sheet-inner">
      <div class="sheet-head">
        <h2 id="sheet-title">Dalabkaaga</h2>
        <button class="icon" value="close" aria-label="Close">✕</button>
      </div>
      <ul id="lines" class="lines"></ul>
      <label class="note">
        <span id="note-label">Fiiro gaar ah (ikhtiyaari)</span>
        <textarea id="note" rows="2" maxlength="200"></textarea>
      </label>
      <div class="sheet-total"><span id="total-label">Wadarta</span><strong id="sheet-total">$0.00</strong></div>
      <button id="send" class="send" type="button">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6-.4.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.3Z"/></svg>
        <span id="send-label">Ku dir WhatsApp</span>
      </button>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
